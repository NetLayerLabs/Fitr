[package]
name = "fitr-vault"
version = "0.1.0"
description = "Fitr $SKR Anti-Sloth Commitment Vault"
edition = "2021"
rust-version = "1.79"

[lib]
crate-type = ["cdylib", "lib"]
name = "fitr_vault"

[features]
# no-idl: drop Anchor's on-chain IDL upload instructions (about 41 KB, ~0.2 SOL of deploy rent). Nothing
# reads an on-chain Anchor IDL: the app uses the Codama client generated from target/idl at build time.
default = ["no-idl"]
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
# silence check-cfg warnings emitted by anchor 0.31 macros on newer rustc
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.31.1", default-features = false, features = ["token", "token_2022", "token_2022_extensions", "associated_token"] }
# Same major as anchor-spl 0.31.x (TokenGroupMember is not re-exported by spl-token-2022 6.0)
spl-token-group-interface = "0.5"

[dev-dependencies]
litesvm = "=0.6.1"
solana-keypair = "2.2"
solana-signer = "2.2"
solana-transaction = "2.2"
solana-account = "2.2"
